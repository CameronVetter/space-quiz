<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit — Space Quiz</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f4fb;
      --surface: #fff;
      --surface-soft: #f8f7ff;
      --ink: #1e1b35;
      --muted: #79758d;
      --line: #e9e6f1;
      --accent: #7157e8;
      --accent-dark: #5d43d2;
      --accent-soft: #f0edff;
      --success: #17864f;
      --success-bg: #eaf8ef;
      --error: #c43d51;
      --error-bg: #fff0f1;
      --panel-grid: rgb(113 87 232 / 7%);
      --star: rgb(91 67 194 / 68%);
      --status: #17864f;
      --shadow: 0 24px 70px rgb(48 39 93 / 10%), 0 3px 12px rgb(48 39 93 / 4%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #11101a;
        --surface: #1b1927;
        --surface-soft: #242131;
        --ink: #f3f0ff;
        --muted: #aaa5be;
        --line: #353145;
        --accent: #a795ff;
        --accent-dark: #c0b4ff;
        --accent-soft: #302a4a;
        --success: #73dfa0;
        --success-bg: #193a2b;
        --error: #ff8997;
        --error-bg: #44242b;
        --panel-grid: rgb(167 149 255 / 9%);
        --star: rgb(194 180 255 / 82%);
        --status: #73dfa0;
        --shadow: 0 24px 70px rgb(0 0 0 / 32%), 0 3px 12px rgb(0 0 0 / 18%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 44px 20px 36px;
      display: grid;
      place-items: center;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 8% 14%, rgb(173 157 255 / 16%), transparent 26rem),
        radial-gradient(ellipse at 92% 88%, rgb(255 177 196 / 13%), transparent 24rem),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      inset: 0;
      pointer-events: none;
      opacity: .68;
      background-image:
        radial-gradient(2px 2px at 19px 27px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 71px 83px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 139px 42px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 203px 109px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 287px 23px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 42px 167px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 113px 218px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 181px 174px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 253px 245px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 312px 153px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 48px 48px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 96px 137px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 162px 93px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 230px 194px, var(--star) 99%, transparent 100%),
        radial-gradient(1.5px 1.5px at 278px 126px, var(--star) 99%, transparent 100%),
        radial-gradient(2px 2px at 24px 250px, var(--star) 99%, transparent 100%);
      background-size: 320px 280px;
    }

    button { font: inherit; }

    .app {
      position: relative;
      z-index: 1;
      width: min(100%, 510px);
      animation: arrive 550ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 22px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background-color: var(--surface);
      background-image:
        linear-gradient(var(--panel-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--panel-grid) 1px, transparent 1px);
      background-size: 18px 18px;
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 35%), 0 5px 18px rgb(48 39 93 / 5%);
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
      border-radius: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 19px;
      box-shadow: inset 0 0 12px color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .brand-copy {
      min-width: 0;
      display: grid;
      gap: 1px;
    }

    .brand-kicker {
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .16em;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .brand-title {
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .09em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .brand-separator { color: var(--accent); }

    .brand-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
      padding: 6px 9px;
      border: 1px solid color-mix(in srgb, var(--status) 24%, var(--line));
      border-radius: 999px;
      background: color-mix(in srgb, var(--status) 8%, var(--surface));
      color: var(--status);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      line-height: 1;
      text-transform: uppercase;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--status);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--status) 16%, transparent);
    }

    .card {
      overflow: hidden;
      border: 1px solid rgb(125 111 164 / 10%);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-inner { padding: 30px 34px 32px; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .score-icon { color: #f0a92d; }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8c75f3, #cf77e8);
      transition: width 420ms cubic-bezier(.2, .8, .2, 1);
    }

    .question-area { padding-top: 31px; }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: 9px;
      font-size: clamp(23px, 5vw, 28px);
      font-weight: 760;
      letter-spacing: -.04em;
      line-height: 1.2;
    }

    .subtitle {
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 15px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 10px 14px;
      border: 1.5px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgb(113 87 232 / 9%);
    }

    .answer:focus-visible, .primary:focus-visible, .restart:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
      outline-offset: 3px;
    }

    .answer-letter {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .answer-text { font-size: 15px; font-weight: 560; }

    .answer.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .answer.selected .answer-letter {
      background: var(--accent);
      color: #fff;
    }

    .answer:disabled { cursor: default; }

    .answer.correct {
      border-color: var(--success);
      background: var(--success-bg);
      color: var(--success);
      animation: pop 380ms ease both;
    }

    .answer.correct .answer-letter {
      background: var(--success);
      color: #fff;
    }

    .answer.wrong {
      border-color: var(--error);
      background: var(--error-bg);
      color: var(--error);
      animation: shake 420ms ease both;
    }

    .answer.wrong .answer-letter {
      background: var(--error);
      color: #fff;
    }

    .feedback {
      min-height: 25px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .feedback.success { color: var(--success); }
    .feedback.error { color: var(--error); }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    .hint { margin: 0; color: var(--muted); font-size: 12px; }

    .primary, .restart {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 19px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform 150ms ease, opacity 150ms ease, background 150ms ease;
    }

    .primary:hover:not(:disabled), .restart:hover {
      transform: translateY(-1px);
      background: var(--accent-dark);
    }

    .primary:disabled { cursor: not-allowed; opacity: .48; }

    .results {
      padding: 46px 34px 38px;
      text-align: center;
      animation: arrive 450ms ease both;
    }

    .result-emoji {
      width: 94px;
      height: 94px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 30px;
      background: var(--accent-soft);
      font-size: 54px;
      animation: float 2.4s ease-in-out infinite;
    }

    .results h1 { margin-bottom: 10px; font-size: 30px; }
    .result-copy { max-width: 330px; margin: 0 auto 25px; color: var(--muted); }

    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 25px;
      color: var(--accent);
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -.05em;
    }

    .result-score span:last-child {
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .personal-best {
      margin: -16px 0 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .personal-best strong {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .restart { min-width: 170px; }

    .footer-note {
      margin: 17px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes star-drift {
      to { background-position: 320px 280px; }
    }

    @keyframes shake {
      15%, 45%, 75% { transform: translateX(-5px); }
      30%, 60%, 90% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    @keyframes pop {
      0% { transform: scale(.98); }
      55% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(2deg); }
    }

    @media (max-width: 520px) {
      body { padding: 26px 14px; }
      .card { border-radius: 20px; }
      .card-inner { padding: 24px 21px 25px; }
      .question-area { padding-top: 26px; }
      .results { padding: 38px 22px 31px; }
      .hint { display: none; }
      .actions { justify-content: flex-end; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      body::before { animation: star-drift 120s linear infinite; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand" aria-label="Mission control">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-copy">
        <span class="brand-kicker">Mission control · Flight 01</span>
        <span class="brand-title">Orbit <span class="brand-separator" aria-hidden="true">·</span> Space quiz</span>
      </span>
      <span class="brand-status"><span class="status-light" aria-hidden="true"></span>Live</span>
    </header>
    <section class="card" aria-label="Space exploration quiz">
      <div class="card-inner" id="quiz">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score"><span class="score-icon" aria-hidden="true">★</span><span id="score">0</span> points</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress"></div>
        </div>
        <div class="question-area">
          <p class="eyebrow">Your mission awaits</p>
          <h1 id="question" tabindex="-1"></h1>
          <p class="subtitle">Choose the best answer to launch forward.</p>
          <div class="answers" id="answers" role="group" aria-label="Answer choices"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="actions">
            <p class="hint">A little space knowledge goes a long way.</p>
            <button class="primary" id="submit" type="button" disabled>Check answer <span aria-hidden="true">→</span></button>
          </div>
        </div>
      </div>
    </section>
    <p class="footer-note">Ten questions. One small step for your score. 🚀</p>
  </main>

  <script>
    const questions = [
      { question: "Which planet is known as the Red Planet?", answers: ["Venus", "Mars", "Mercury", "Jupiter"], correct: 1, fact: "Mars gets its rusty color from iron-rich dust on its surface." },
      { question: "What was the first human-made object to reach space?", answers: ["Sputnik 1", "V-2 rocket", "Apollo 11", "Explorer 1"], correct: 1, fact: "A V-2 rocket crossed the Kármán line in 1944." },
      { question: "Which planet has the most moons confirmed so far?", answers: ["Jupiter", "Neptune", "Saturn", "Uranus"], correct: 2, fact: "Saturn's enormous family of moons includes tiny shepherd moons and icy Titan." },
      { question: "What is the name of NASA's rover currently exploring Mars?", answers: ["Curiosity", "Opportunity", "Perseverance", "Sojourner"], correct: 2, fact: "Perseverance landed in Jezero Crater in February 2021." },
      { question: "Which was the first artificial satellite to orbit Earth?", answers: ["Vanguard 1", "Sputnik 1", "Explorer 1", "Luna 1"], correct: 1, fact: "The Soviet Union launched Sputnik 1 on October 4, 1957." },
      { question: "What is the largest volcano in our solar system?", answers: ["Mauna Loa", "Mount Everest", "Olympus Mons", "Elysium Mons"], correct: 2, fact: "Olympus Mons on Mars is about 22 kilometers (13.6 miles) high." },
      { question: "Which spacecraft carried the first humans to land on the Moon?", answers: ["Gemini 8", "Apollo 8", "Apollo 11", "Apollo 13"], correct: 2, fact: "Apollo 11's lunar module Eagle touched down on July 20, 1969." },
      { question: "What is the name of the galaxy that contains our Solar System?", answers: ["Andromeda", "Whirlpool", "Triangulum", "Milky Way"], correct: 3, fact: "Our Solar System sits in a small spiral arm of the Milky Way." },
      { question: "Which telescope launched in 2021 to observe the early universe?", answers: ["Hubble Space Telescope", "Kepler Space Telescope", "James Webb Space Telescope", "Chandra X-ray Observatory"], correct: 2, fact: "The James Webb Space Telescope began science operations in 2022." },
      { question: "What keeps planets in orbit around the Sun?", answers: ["Magnetism", "Gravity", "Solar wind", "Atmospheric pressure"], correct: 1, fact: "The Sun's gravity bends each planet's path into a steady orbit." }
    ];

    const PERSONAL_BEST_KEY = "orbit-personal-best";
    const quiz = document.querySelector("#quiz");
    let questionCount = document.querySelector("#question-count");
    let scoreDisplay = document.querySelector("#score");
    let progress = document.querySelector("#progress");
    let progressTrack = document.querySelector(".progress-track");
    let questionTitle = document.querySelector("#question");
    let answersContainer = document.querySelector("#answers");
    let feedback = document.querySelector("#feedback");
    let submitButton = document.querySelector("#submit");
    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = null;
    let answered = false;

    let sessionPersonalBest = null;

    function getPersonalBest() {
      try {
        const storedBest = window.localStorage.getItem(PERSONAL_BEST_KEY);
        if (storedBest === null || !/^\d+$/.test(storedBest)) return null;
        const best = Number(storedBest);
        return Number.isInteger(best) && best <= questions.length ? best : null;
      } catch {
        return null;
      }
    }

    function savePersonalBest(completedScore) {
      const storedBest = getPersonalBest();
      const previousBest = storedBest === null
        ? sessionPersonalBest
        : Math.max(storedBest, sessionPersonalBest ?? storedBest);
      const best = previousBest === null ? completedScore : Math.max(previousBest, completedScore);
      sessionPersonalBest = best;
      if (best !== storedBest) {
        try {
          window.localStorage.setItem(PERSONAL_BEST_KEY, String(best));
        } catch {
          // Keep the in-memory best when browser storage is unavailable.
        }
      }
      return best;
    }

    function renderQuestion() {
      const item = questions[currentQuestion];
      selectedAnswer = null;
      answered = false;
      questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      scoreDisplay.textContent = score;
      progress.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", currentQuestion + 1);
      questionTitle.textContent = item.question;
      feedback.textContent = "";
      feedback.className = "feedback";
      submitButton.disabled = true;
      submitButton.innerHTML = 'Check answer <span aria-hidden="true">→</span>';
      answersContainer.replaceChildren();

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span class="answer-text"></span>`;
        button.querySelector(".answer-text").textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        answersContainer.append(button);
      });
      questionTitle.focus({ preventScroll: true });
    }

    function selectAnswer(index) {
      if (answered) return;
      selectedAnswer = index;
      [...answersContainer.children].forEach((button, buttonIndex) => {
        const selected = buttonIndex === index;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
      submitButton.disabled = false;
    }

    function checkAnswer() {
      if (selectedAnswer === null || answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const buttons = [...answersContainer.children];
      buttons.forEach(button => { button.disabled = true; });
      buttons[item.correct].classList.add("correct");

      if (selectedAnswer === item.correct) {
        score += 1;
        scoreDisplay.textContent = score;
        feedback.textContent = `That's right! ${item.fact}`;
        feedback.classList.add("success");
      } else {
        buttons[selectedAnswer].classList.add("wrong");
        feedback.textContent = `Not quite! ${item.fact}`;
        feedback.classList.add("error");
      }

      submitButton.disabled = false;
      submitButton.innerHTML = currentQuestion === questions.length - 1
        ? 'See my results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
    }

    function advance() {
      if (!answered) {
        checkAnswer();
        return;
      }
      currentQuestion += 1;
      if (currentQuestion === questions.length) {
        showResults();
        return;
      }
      renderQuestion();
    }

    function showResults() {
      const personalBest = savePersonalBest(score);
      const percentage = score / questions.length;
      const result = percentage === 1
        ? { emoji: "🏆", title: "Out of this world!", copy: "A perfect mission. The cosmos has nothing left to hide from you." }
        : percentage >= .7
          ? { emoji: "🚀", title: "Stellar work!", copy: "You've got serious space smarts. Keep reaching for the stars." }
          : percentage >= .4
            ? { emoji: "🪐", title: "Nice orbit!", copy: "A solid trip through the cosmos—and plenty more to discover." }
            : { emoji: "🌱", title: "Future astronaut!", copy: "Every explorer starts somewhere. Ready for another launch?" };
      quiz.innerHTML = `
        <div class="results" role="status">
          <div class="result-emoji" aria-hidden="true">${result.emoji}</div>
          <p class="eyebrow">Mission complete</p>
          <h1 tabindex="-1">${result.title}</h1>
          <p class="result-copy">${result.copy}</p>
          <div class="result-score"><span>${score}</span><span>/ ${questions.length} points</span></div>
          <p class="personal-best">Personal best: <strong>${personalBest} / ${questions.length}</strong></p>
          <br>
          <button class="restart" type="button">Play again <span aria-hidden="true">↻</span></button>
        </div>`;
      quiz.querySelector("h1").focus({ preventScroll: true });
      quiz.querySelector(".restart").addEventListener("click", restart);
    }

    function restart() {
      currentQuestion = 0;
      score = 0;
      quiz.innerHTML = `
        <div class="topline">
          <span id="question-count"></span>
          <span class="score"><span class="score-icon" aria-hidden="true">★</span><span id="score"></span> points</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><div class="progress-fill" id="progress"></div></div>
        <div class="question-area">
          <p class="eyebrow">Your mission awaits</p><h1 id="question" tabindex="-1"></h1>
          <p class="subtitle">Choose the best answer to launch forward.</p>
          <div class="answers" id="answers" role="group" aria-label="Answer choices"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="actions"><p class="hint">A little space knowledge goes a long way.</p><button class="primary" id="submit" type="button" disabled>Check answer <span aria-hidden="true">→</span></button></div>
        </div>`;
      bindElements();
      renderQuestion();
    }

    function bindElements() {
      questionCount = quiz.querySelector("#question-count");
      scoreDisplay = quiz.querySelector("#score");
      progress = quiz.querySelector("#progress");
      progressTrack = quiz.querySelector(".progress-track");
      questionTitle = quiz.querySelector("#question");
      answersContainer = quiz.querySelector("#answers");
      feedback = quiz.querySelector("#feedback");
      submitButton = quiz.querySelector("#submit");
      submitButton.addEventListener("click", advance);
    }

    submitButton.addEventListener("click", advance);
    renderQuestion();
  </script>
</body>
